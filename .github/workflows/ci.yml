# Pull request / main gate: lint, type check, dependency audit, tests, and an image
# build with a smoke test (container starts, UI is served, MOCK import works).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream; Dependabot bumps it
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run --locked ruff check --output-format github .
          uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy .
      - name: App imports
        run: DB_PATH=/tmp/ci.duckdb TENANTS_CONFIG=/nonexistent uv run --locked python -c "import app.main"
      - name: Build and size-check frontend CSS
        working-directory: .
        run: |
          scripts/build-css.sh --output /tmp/cpi-log-lens-tailwind.css
          size=$(gzip -n -c /tmp/cpi-log-lens-tailwind.css | wc -c | tr -d '[:space:]')
          echo "Generated CSS: ${size} bytes gzip"
          test "$size" -le 61440
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Frontend modules parse
        # node --check skips files with import statements unless told they are modules
        run: |
          for f in $(find ../frontend/js -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "::error::$f does not parse"; exit 1; }
          done
          node --check ../scripts/test-rendered-accessibility.mjs
      - name: Browse URL state
        working-directory: .
        run: node scripts/test-browse-url.mjs
      - name: Accessible frontend behavior
        working-directory: .
        run: node scripts/test-accessibility.mjs
      - name: Fetch progress state
        working-directory: .
        run: node scripts/test-fetch-progress.mjs
      - name: Dependency vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit --disable-pip -r /tmp/requirements.txt

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run --locked pytest --cov --cov-report=term

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cpi-log-lens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e MOCK=true cpi-log-lens:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>CPI Log Lens</title>"
          curl -fsS http://127.0.0.1:8080/tailwind.css -o /tmp/shipped-tailwind.css
          css_size=$(gzip -n -c /tmp/shipped-tailwind.css | wc -c | tr -d '[:space:]')
          echo "Shipped CSS: ${css_size} bytes gzip"
          test "$css_size" -le 61440
          docker exec smoke sh -c 'test ! -d /opt/tailwind && ! command -v tailwindcss'
          curl -fsS -X POST http://127.0.0.1:8080/api/tenants -H 'Content-Type: application/json' \
            -d '{"id":"demo","name":"DEMO","api_url":"https://example.invalid","oauth_url":"https://example.invalid/token","client_id":"c","client_secret":"s"}'
          curl -fsS -X POST http://127.0.0.1:8080/api/fetch -H 'Content-Type: application/json' \
            -d '{"tenants":["demo"],"log_types":["trace"],"hours":0}'
          for i in $(seq 1 30); do
            status=$(curl -fsS http://127.0.0.1:8080/api/fetch/status)
            echo "$status" | grep -q '"status":"running"' || break
            sleep 1
          done
          echo "$status"
          echo "$status" | grep -q '"status":"done"'
          echo "$status" | grep -Eq '"imported":[1-9]'
          for i in $(seq 1 30); do
            [ "$(docker inspect smoke --format '{{.State.Health.Status}}')" = healthy ] && break
            sleep 2
          done
          docker inspect smoke --format '{{.State.Health.Status}}' | grep -qx healthy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned rendered accessibility test tools
        run: |
          mkdir -p "$RUNNER_TEMP/axe-browser"
          npm install --prefix "$RUNNER_TEMP/axe-browser" --no-save --no-package-lock \
            playwright@1.55.0 axe-core@4.10.3
          "$RUNNER_TEMP/axe-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Audit rendered pages and dialogs with axe-core
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/axe-browser/node_modules/playwright/index.mjs
          AXE_CORE_PATH: ${{ runner.temp }}/axe-browser/node_modules/axe-core/axe.min.js
        run: node scripts/test-rendered-accessibility.mjs
      - name: Container logs
        if: always()
        run: docker logs smoke || true
      - name: Scan image (fail on fixable critical/high findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cpi-log-lens:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
