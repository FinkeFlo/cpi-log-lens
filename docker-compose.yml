services:
  app:
    build: .
    ports:
      # Only reachable from this machine by default. To expose it on the network
      # set BIND_ADDRESS=0.0.0.0 — and put authentication in front of it.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/data                          # DuckDB database + raw log files
      # Optional: config/tenants.jsonc seeds tenants on start (see
      # config/tenants.jsonc.example). Tenants can also be added in the UI.
      - ./config:/config:ro
    env_file:
      - path: .env        # optional, see .env.example
        required: false
    environment:
      # Honour MOCK=true from the shell as well as from .env.
      - MOCK=${MOCK:-false}
      - DB_PATH=/data/cpi_logs.duckdb
      - LOGS_DIR=/data/logs
      - TENANTS_CONFIG=/config/tenants.jsonc
    # Hard ceiling for the whole container; DUCKDB_MEMORY_LIMIT must stay well
    # below it (default 1.5GB) because Python and non-buffer allocations add up.
    mem_limit: ${APP_MEM_LIMIT:-4g}
    restart: unless-stopped
    # Give a running import time to finish its current write and checkpoint.
    stop_grace_period: 60s
